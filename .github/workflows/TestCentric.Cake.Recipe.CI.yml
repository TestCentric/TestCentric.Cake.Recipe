name: TestCentric.Cake.Recipe.CI

# The Cake script decides what to publish. Only builds of main publish:
# every main build goes to MyGet, and a main build whose head is tagged
# with a release version (e.g. 2.0.0-beta.1) also goes to NuGet and GitHub.
# Pushing a tag alone publishes nothing, so after tagging the head of main,
# run this workflow on main (workflow_dispatch).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.txt'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.txt'
      - '**/*.md'

env:
  DOTNET_NOLOGO: true # Disable the .NET logo
  DOTNET_CLI_TELEMETRY_OPTOUT: true # Disable sending .NET CLI telemetry

jobs:
  ContinuousIntegration:
    name: Continuous Integration
    runs-on: windows-latest

    env:
      TESTCENTRIC_MYGET_API_KEY: ${{ secrets.TESTCENTRIC_MYGET_API_KEY }}
      TESTCENTRIC_NUGET_API_KEY: ${{ secrets.TESTCENTRIC_NUGET_API_KEY }}
      TESTCENTRIC_CHOCO_API_KEY: ${{ secrets.TESTCENTRIC_CHOCO_API_KEY }}
      GITHUB_ACCESS_TOKEN: ${{ secrets.TESTCENTRIC_GITHUB_ACCESS_TOKEN }}

    steps:
    - name: ⤵️ Checkout Source
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # MinVer needs the full history and tags

    - name: 🛠️ Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: 🛠️ Install dotnet tools
      run: dotnet tool restore

    - name: 🧪 Check Release Tool Startup
      run: dotnet tool run dotnet-gitreleasemanager -- showconfig --no-logo

    - name: 🍰 Package and Publish Recipe (Cake script decides)
      run: dotnet run --file build.cs -- --target=ContinuousIntegration --configuration=Release

    - name: 💾 Upload Packages
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Packages
        path: packages/*.nupkg
