# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration: https://docs.coderabbit.ai/reference/configuration
# Project conventions live in AGENTS.md, which CodeRabbit reads as code guidelines.

language: en-US

reviews:
  profile: chill
  poem: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    drafts: false

  pre_merge_checks:
    # The project does not require XML docs on every member, so this check
    # only produced warnings on ordinary PRs.
    docstrings:
      mode: "off"

  path_instructions:
    - path: "build.cs"
      instructions: |
        The recipe's own build script, a Cake.Sdk file-based app run with `dotnet build.cs`.
        It includes the files in the recipe directory with IncludeAdditionalFiles.
        See https://cakebuild.net/docs/running-builds/runners/cake-sdk for more information.
    - path: "recipe/**/*.cs"
      instructions: |
        Recipe files, compiled as ordinary C# under Cake.Sdk. Each is wrapped in
        `public static partial class Program`, so its members and nested types are
        visible to the build script and to each other, and Cake aliases such as
        Information() and Task() can be called directly. Watch for names that clash
        with Cake aliases or with types Cake.Sdk generates, such as Program.Helper.
